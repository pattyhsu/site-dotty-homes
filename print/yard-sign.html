<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<title>Dotty Homes — yard sign (18×24)</title>
<!--
  YARD SIGN — 18×24" trim, 18.25×24.25" with bleed. Corrugated plastic,
  print both sides with this same artwork.

  Planted at active job sites while the crew works. Read from a moving car
  and from the sidewalk, so it carries exactly three things: who did this,
  the phone number, and the code. No paragraph survives at 20 feet.

  QR → /go/yard/ → /estimate/?src=yard.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="print.css" />
<style>
  @page { size: 18.25in 24.25in; }
  .sheet { width: 18.25in; height: 24.25in; }

  .safe { align-items: center; text-align: center; }

  .wordmark { font-size: 132pt; justify-content: center; }
  .wordmark .dot { width: 0.34in; height: 0.34in; margin: 0 0.24in; }

  .tagline {
    font-size: 22pt;
    letter-spacing: 0.3em;
    margin-top: 0.34in;
  }

  .banner-rule {
    width: 100%;
    height: 0.06in;
    background: var(--accent);
    margin: 0.62in 0;
  }

  .headline { font-size: 96pt; }

  .subline {
    font-family: var(--sans);
    font-weight: 500;
    font-size: 30pt;
    color: var(--ink);
    margin-top: 0.4in;
    line-height: 1.3;
  }

  /* Absorbs whatever vertical slack is left, so the sign never has a dead
     band in the middle — and a passerby gets to see the work, not just
     read a claim about it. */
  .shot {
    flex: 1;
    width: 100%;
    overflow: hidden;
    margin-top: 0.7in;
    min-height: 4in;
  }

  .scan {
    margin-top: 0.6in;
    width: 100%;
    padding: 0.62in;
    gap: 0.62in;
    text-align: left;
  }
  .scan img { width: 4.5in; height: 4.5in; }
  .scan .say .lead { font-size: 62pt; }
  .scan .say .sub {
    font-size: 22pt;
    margin-top: 0.18in;
    line-height: 1.35;
  }

  .phone {
    font-size: 88pt;
    margin-top: 0.55in;
  }
  .phone small {
    display: block;
    font-family: var(--sans);
    font-weight: 500;
    font-size: 20pt;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--stone);
    margin-bottom: 0.18in;
  }

  .license {
    font-size: 19pt;
    letter-spacing: 0.1em;
    margin-top: 0.5in;
  }
</style>
</head>
<body>
  <div class="sheet">
    <div class="safe">
      <div class="wordmark"><span>Dotty</span><span class="dot"></span><span>Homes</span></div>
      <div class="tagline">Built happy &middot; Built well</div>

      <div class="banner-rule"></div>

      <h1 class="headline">Remodeled by <em>us.</em></h1>
      <p class="subline">Kitchens &middot; Baths &middot; Additions &middot; Whole homes<br />No project too small.</p>

      <div class="phone"><small>Free estimate</small>626&thinsp;&middot;&thinsp;340&thinsp;&middot;&thinsp;4388</div>

      <div class="shot"><img class="photo" src="../photos/home-11.jpg" alt="" /></div>

      <div class="scan">
        <img src="qr/yard.svg" alt="" />
        <div class="say">
          <span class="lead">Scan me.</span>
          <span class="sub">Tell us what you&rsquo;re thinking about &mdash;<br />we&rsquo;ll call you back the same day.</span>
        </div>
      </div>

      <p class="license">dottyhomes.com &nbsp;&middot;&nbsp; CSLB #1137668 &nbsp;&middot;&nbsp; Fully insured</p>
    </div>
  </div>

  <script>
    if (location.search.indexOf('guides') !== -1) document.body.classList.add('guides');
  </script>
</body>
</html>
