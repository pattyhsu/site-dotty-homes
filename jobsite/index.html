<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Job site photos · Dotty Homes</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dotty Photos">
<!--
  Crew photo and video upload. One link per build; the deal is identified by the token
  in the URL, so a photo can never be filed against the wrong house.

  Lives here rather than in the Edge Function because Supabase rewrites any
  text/html response from a function to text/plain (anti-phishing policy on
  the shared *.supabase.co origin). Same split as /estimate/ -> lead-intake.

  Bilingual because the crews on these builds speak Spanish, and a page they
  cannot read is a page they will not use.
-->
<style>
  :root{--ink:#1b1b1b;--mut:#6b6b6b;--line:#e3e0da;--bg:#faf8f5;--acc:#2F7A4D;--err:#AE3B2C}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       padding:26px 18px calc(28px + env(safe-area-inset-bottom))}
  h1{font-size:21px;margin:0 0 2px;min-height:26px}
  .sub{color:var(--mut);font-size:14px;margin:0 0 26px}
  /* One enormous target: gloves, sunlight, one hand. */
  label.pick{display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;min-height:176px;border:2px dashed var(--line);border-radius:16px;
    background:#fff;cursor:pointer;font-size:19px;font-weight:600;
    -webkit-tap-highlight-color:transparent}
  label.pick:active{background:#f2efe9}
  label.pick[aria-disabled="true"]{opacity:.45;pointer-events:none}
  .cam{font-size:40px;line-height:1}
  .es{font-size:14px;font-weight:400;color:var(--mut)}
  input[type=file]{display:none}
  ul{margin:18px 0 0;padding:0;list-style:none}
  li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;
     border-bottom:1px solid var(--line);font-size:15px}
  li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ok{color:var(--acc);font-weight:600}.bad{color:var(--err);font-weight:600}
  #done{margin-top:22px;padding:16px;border-radius:14px;background:#E7F2E9;
        color:#1D4A2F;font-weight:600;display:none}
  #dead{margin-top:22px;padding:16px;border-radius:14px;background:#F8E7E3;
        color:#5A241A;display:none}
  footer{margin-top:32px;color:var(--mut);font-size:12.5px}
</style>
</head>
<body>
  <h1 id="label">…</h1>
  <p class="sub">Daily photos &amp; video · Fotos y video del progreso</p>

  <label class="pick" id="pick" aria-disabled="true">
    <span class="cam">📷</span>
    <span>Add photos or video</span>
    <span class="es">Agregar fotos o video</span>
    <!--
      NO `capture` ATTRIBUTE, deliberately. `capture="environment"` forces the
      camera straight open and REMOVES the ability to pick anything already
      shot — which is most of what actually happens: the crew photographs a
      wall when the light is right and sends it at lunch, not the instant they
      take it. Without `capture` the phone shows its own chooser — Photo
      Library / Take Photo or Video / Choose File — so both paths work from one
      button. Costs the camera path a single tap; buys the library path at all.
    -->
    <input id="f" type="file" accept="image/*,video/*" multiple>
  </label>

  <ul id="list"></ul>
  <div id="done">Sent. Thank you. · Enviado. Gracias.</div>
  <div id="dead"><b>This link is not active.</b><br>Ask the office for a new one.<br>
                 <span class="es">Pida un enlace nuevo a la oficina.</span></div>

  <footer>Dotty Homes</footer>

<script>
(function () {
  var API = 'https://pwrnywsojomrygsiezzi.supabase.co/functions/v1/progress-photo';
  // Mirrors MAX_BYTES in the progress-photo function. A sanity bound, not a
  // technical ceiling: the bytes go straight to storage now, so nothing here
  // buffers them. Keep the two in step.
  var MAX_BYTES = 1024 * 1024 * 1024;
  var TOO_BIG = 'too long · más corto';
  var T = new URLSearchParams(location.search).get('t') || '';

  // ── Thumbnails ──────────────────────────────────────────────────────────
  // Made HERE, in the browser, because the bytes no longer pass through our
  // function — the phone uploads straight to storage, so there is no
  // server-side moment where the image exists to resize. The phone has it
  // decoded already, so this is nearly free.
  //
  // Originals stay untouched at full resolution (they feed social media). This
  // only exists so a strip of 78px tiles in the app is not a strip of 3 MB
  // JPEGs — that is ~14 MB to draw one row on a cellular connection.
  //
  // EVERY failure path returns null rather than throwing. A thumbnail is a
  // nicety; the photo is the point. Old device, a video frame iOS refuses to
  // paint, a backgrounded tab mid-encode — all of them end as "no thumbnail",
  // the upload proceeds, and the app falls back to the original.
  var THUMB_MAX = 480;          // longest edge
  var THUMB_WAIT = 8000;        // never let a stuck decode hold up an upload

  function canvasThumb(src, w, h) {
    var s = Math.min(1, THUMB_MAX / Math.max(w, h));
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * s));
    c.height = Math.max(1, Math.round(h * s));
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
    return new Promise(function (res) {
      // toBlob is async and can hand back null; treat that as "no thumbnail".
      c.toBlob(function (b) { res(b || null); }, 'image/jpeg', 0.72);
    });
  }

  function makeThumb(file) {
    return new Promise(function (resolve) {
      var done = false;
      function finish(v) { if (!done) { done = true; resolve(v); } }
      setTimeout(function () { finish(null); }, THUMB_WAIT);

      var url = URL.createObjectURL(file);
      function cleanup(v) { URL.revokeObjectURL(url); finish(v); }

      try {
        if (file.type.indexOf('image/') === 0) {
          var img = new Image();
          img.onload = function () {
            canvasThumb(img, img.naturalWidth, img.naturalHeight).then(cleanup, function () { cleanup(null); });
          };
          img.onerror = function () { cleanup(null); };
          img.src = url;
        } else if (file.type.indexOf('video/') === 0) {
          // A poster frame. iOS needs muted + playsinline before it will
          // decode a frame off-screen, and may still decline — hence the
          // timeout above and the null-safe path everywhere below.
          var v = document.createElement('video');
          v.muted = true; v.playsInline = true; v.preload = 'metadata';
          v.onloadeddata = function () {
            canvasThumb(v, v.videoWidth, v.videoHeight).then(cleanup, function () { cleanup(null); });
          };
          v.onerror = function () { cleanup(null); };
          v.onloadedmetadata = function () {
            // A hair in, not frame zero: the first frame of a handheld clip is
            // often a blur or a lens cap.
            try { v.currentTime = Math.min(0.6, (v.duration || 1) / 3); } catch (_) {}
          };
          v.src = url;
        } else {
          cleanup(null);
        }
      } catch (_) { cleanup(null); }
    });
  }

  function putBlob(url, blob, type, onProgress) {
    return new Promise(function (resolve, reject) {
      var x = new XMLHttpRequest();
      x.open('PUT', url, true);
      x.setRequestHeader('Content-Type', type);
      if (onProgress) x.upload.onprogress = onProgress;
      x.onload = function () {
        (x.status >= 200 && x.status < 300) ? resolve() : reject(new Error('put ' + x.status));
      };
      x.onerror = function () { reject(new Error('network')); };
      x.send(blob);
    });
  }

  // Every call to our function is JSON. It only ever signs a URL and records a
  // row — it never carries a file.
  function api(payload) {
    return fetch(API + '?t=' + encodeURIComponent(T), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    }).then(function (r) {
      if (r.ok) return r.json();
      // Carry the status through so the caller can tell "too large" apart
      // from "try again" — they need opposite advice.
      var e = new Error('http ' + r.status);
      e.status = r.status;
      throw e;
    });
  }

  var pick = document.getElementById('pick');
  var list = document.getElementById('list');
  var done = document.getElementById('done');
  var dead = document.getElementById('dead');

  function showDead() {
    document.getElementById('label').textContent = 'Link not active';
    pick.style.display = 'none';
    dead.style.display = 'block';
  }

  // Resolve the token to a house name first, so the crew can see they are on
  // the right job before sending anything.
  if (!T) { showDead(); return; }
  fetch(API + '?t=' + encodeURIComponent(T))
    .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
    .then(function (d) {
      document.getElementById('label').textContent = d.label;
      document.title = d.label + ' · Photos';
      pick.setAttribute('aria-disabled', 'false');
    })
    .catch(showDead);

  document.getElementById('f').addEventListener('change', function (e) {
    var files = [].slice.call(e.target.files);
    e.target.value = '';                 // allow re-picking the same photo
    if (!files.length) return;
    done.style.display = 'none';

    // Sequential on purpose: a phone on site has one slow uplink, and ten
    // parallel uploads on bad signal all time out together.
    var i = 0, sent = 0;
    (function next() {
      if (i >= files.length) { if (sent) done.style.display = 'block'; return; }
      var file = files[i++];
      var li = document.createElement('li');
      var name = document.createElement('span');
      var state = document.createElement('span');
      name.textContent = file.name.slice(0, 26);
      // A 30 MB clip is minutes on a job-site uplink. Saying so is the
      // difference between waiting and assuming it has hung.
      state.textContent = file.type.indexOf('video') === 0 ? 'sending video…' : 'sending…';
      li.appendChild(name); li.appendChild(state); list.appendChild(li);

      // Checked here as well as on the server, because the point is to NOT
      // spend a job-site uplink on an upload that cannot succeed. The server
      // stays the authority; this only skips the wait.
      if (file.size > MAX_BYTES) {
        state.textContent = TOO_BIG;
        state.className = 'bad';
        next();
        return;
      }

      // Three steps, and the bytes never touch our function: ask it to sign a
      // one-object URL, PUT straight to storage, then tell it to record the
      // row. That is what removed the old 50 MB ceiling — a real 4K clip is
      // past that in about fifteen seconds.
      var signed;
      api({ action: 'sign', mime: file.type, size: file.size })
        .then(function (d) {
          signed = d;
          // Thumbnail first, while the file is still warm in memory — but it
          // is never allowed to fail the upload, so no catch is needed: it
          // resolves to null on every error path.
          return makeThumb(file);
        })
        .then(function (thumb) {
          signed.thumb = thumb;
          // A percentage, because a 200 MB clip is minutes of nothing
          // happening and silence looks identical to a crash.
          return putBlob(signed.url, file, file.type, function (ev) {
            if (ev.lengthComputable) {
              state.textContent = Math.round(ev.loaded / ev.total * 100) + '%';
            }
          });
        })
        .then(function () {
          state.textContent = 'saving…';
          if (!signed.thumb) return false;
          // Best effort, and deliberately after the original is safely up: a
          // failed thumbnail must cost nothing.
          return putBlob(signed.thumbUrl, signed.thumb, 'image/jpeg')
            .then(function () { return true; }, function () { return false; });
        })
        .then(function (haveThumb) {
          return api({
            action: 'confirm',
            key: signed.key,
            thumbKey: haveThumb ? signed.thumbKey : undefined,
          });
        })
        // Two-arg `then`, not `.then().catch()`: the failure handler must see
        // only failures from the upload above it. A `.catch()` here would also
        // swallow anything thrown by the success handler and run `next()`
        // twice, which silently skips a file.
        .then(
          function () { state.textContent = '✓'; state.className = 'ok'; sent++; },
          // No automatic retry: on bad signal a silent retry that half-works
          // is worse than a red line the person can see and tap again. But
          // "try again" is the wrong advice for a size rejection — the same
          // file fails the same way forever — so 413 gets its own message.
          function (err) {
            state.textContent = err && err.status === 413 ? TOO_BIG : 'failed — try again';
            state.className = 'bad';
          },
        )
        .then(next);
    })();
  });
})();
</script>
</body>
</html>
